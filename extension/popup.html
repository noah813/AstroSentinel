<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>AstroSentinel</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            width: 260px;
            padding: 15px;
            background-color: #1a1a1a;
            color: #ffffff;
            margin: 0;
            text-align: center;
        }
        h2 {
            margin-top: 0;
            color: #ff4a4a;
            font-size: 20px;
        }
        .stats {
            margin-top: 15px;
            padding: 15px;
            background-color: #2d2d2d;
            border-radius: 8px;
            border: 1px solid #3d3d3d;
        }
        .count {
            font-size: 32px;
            font-weight: bold;
            color: #ff4a4a;
            margin: 10px 0;
        }
        .subtitle {
            font-size: 13px;
            color: #aaaaaa;
        }
    </style>
</head>
<body>
    <h2>🛡️ AstroSentinel</h2>
    <p style="font-size: 13px; color: #cccccc; text-align: left;">YouTube 網軍防禦系統</p>
    
    <div class="stats">
        <div class="subtitle">此頁面已攔截水軍數量</div>
        <div class="count" id="bot-count">0</div>
        <div class="subtitle">個帳號</div>
    </div>
    
    <script src="popup.js"></script>
</body>
</html>
