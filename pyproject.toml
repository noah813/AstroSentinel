[project]
name = "astro-sentinel"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.10"
dependencies = [
    "google-api-python-client>=2.197.0",
    "google-genai>=2.8.0",
    "joblib>=1.4.2",
    "matplotlib>=3.10.9",
    "numpy>=2.2.6",
    "opencc-python-reimplemented>=0.1.7",
    "pandas>=2.3.3",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.7.2",
    "seaborn>=0.13.2",
    "torch>=2.0.0",
    "transformers>=5.10.0",
    "xgboost>=3.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
